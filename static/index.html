<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 圖片生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --background-color: #f8f9fa;
            --container-bg-color: #ffffff;
            --text-color: #343a40;
            --text-light-color: #6c757d;
            --border-color: #dee2e6;
            --border-radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            color: var(--text-light-color);
        }

        .tabs {
            display: flex;
            background-color: var(--container-bg-color);
            border-radius: var(--border-radius);
            padding: 8px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .tab-button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 500;
            color: var(--text-light-color);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 2px 10px rgba(0, 123, 255, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--container-bg-color);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .card h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fdfdff;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: #f0f6ff;
        }

        .upload-icon {
            font-size: 3em;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            font-weight: 500;
        }
        
        .upload-info {
            font-size: 0.9em;
            color: var(--text-light-color);
            margin-top: 8px;
        }

        .file-input { display: none; }

        .image-preview-container {
            text-align: center;
            margin-top: 20px;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .template-card {
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .template-card-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: var(--background-color);
        }

        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .template-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }
        
        .template-card-name {
            font-weight: 500;
            font-size: 1em;
        }
        
        .template-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light-color);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        .input-group .info-text {
            font-size: 0.85em;
            color: var(--text-light-color);
            margin-top: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .btn:disabled {
            background-color: #ced4da;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #6c757d; /* A neutral grey for secondary actions */
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.3);
        }

        /* Container for advanced parameters, initially hidden */
        .custom-params-inputs-container {
            display: none;
            margin-top: 20px; /* Spacing below the toggle button */
            padding-top: 20px; /* Padding for separation */
            border-top: 1px solid var(--border-color); /* Separator line */
        }

        .result-section { margin-top: 30px; }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .result-image-container {
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .result-image {
            width: 100%;
            display: block;
        }

        .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 123, 255, 0.8);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .result-image-container:hover .download-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .message.show { display: block; }
        .error-message { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success-message { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            header h1 { font-size: 2em; }
            .card { padding: 20px; }
            .template-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }

        @media (max-width: 480px) {
            body { padding: 15px 5px; }
            .tabs { flex-direction: column; }
            .tab-button { flex: none; }
            .template-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .result-images { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>AI 藝術生成器</h1>
            <p>上傳一張圖片，選擇您喜愛的風格，創造獨一無二的藝術作品</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="template-tab">🎨 風格模板</button>
            <button class="tab-button" data-tab="custom-tab">⚙️ 自訂參數</button>
        </div>

        <!-- Tab 1: 模板選擇 -->
        <div id="template-tab" class="tab-content active">
            <div class="card">
                <h3>1. 上傳你的照片</h3>
                <div class="upload-area" id="uploadAreaTemplate">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">點擊或拖曳圖片到此處</div>
                    <div class="upload-info">支援 JPG, PNG 格式</div>
                </div>
                <input type="file" id="fileInputTemplate" class="file-input" accept="image/*">
                <div class="image-preview-container" id="previewContainerTemplate"></div>
            </div>

            <div class="card">
                <h3>2. 選擇風格模板</h3>
                <div id="templateLoading">載入模板中...</div>
                <div class="template-grid" id="templateGrid"></div>
            </div>

            <button class="btn btn-primary" id="generateBtnTemplate" disabled>請先上傳圖片</button>
            <div class="message error-message" id="errorMessageTemplate"></div>
            <div class="result-section" id="resultSectionTemplate">
                <div class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <div class="loading-text">正在生成中，請稍候...</div>
                </div>
                <div class="message success-message" id="successMessageTemplate"></div>
                <div class="result-images" id="resultImagesTemplate"></div>
            </div>
        </div>

        <!-- Tab 2: 自訂參數 -->
        <div id="custom-tab" class="tab-content">
            <div class="card">
                <h3>1. 上傳你的照片</h3>
                <div class="upload-area" id="uploadAreaCustom">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">點擊或拖曳圖片到此處</div>
                    <div class="upload-info">支援 JPG, PNG 格式</div>
                </div>
                <input type="file" id="fileInputCustom" class="file-input" accept="image/*">
                <div class="image-preview-container" id="previewContainerCustom"></div>
            </div>

            <div class="card">
                <h3>2. 輸入自訂參數 (選填)</h3>
                <button class="btn btn-secondary" id="paramsToggleCustom">顯示進階設定</button>
                <div id="customParamsInputs" class="custom-params-inputs-container">
                    <div class="input-group">
                        <label for="appId">App ID</label>
                        <input type="text" id="appId" placeholder="留空使用預設值">
                    </div>
                    <div class="input-group">
                        <label for="versionId">Version ID</label>
                        <input type="text" id="versionId" placeholder="留空使用預設值">
                    </div>
                    <div class="input-group">
                        <label for="cnetFormId">ControlNet Form ID</label>
                        <input type="text" id="cnetFormId" placeholder="留空使用預設值">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" id="generateBtnCustom" disabled>請先上傳圖片</button>
            <div class="message error-message" id="errorMessageCustom"></div>
            <div class="result-section" id="resultSectionCustom">
                <div class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <div class="loading-text">正在生成中，請稍候...</div>
                </div>
                <div class="message success-message" id="successMessageCustom"></div>
                <div class="result-images" id="resultImagesCustom"></div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // ---通用功能---
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            const tabId = button.getAttribute('data-tab');
            
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            button.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        });
    });

    const setupUploadArea = (uploadArea, fileInput, previewContainer, onFileSelect) => {
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'));
        });

        uploadArea.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

        const handleFile = (file) => {
            if (!file || !file.type.startsWith('image/')) {
                onFileSelect(null, '請選擇有效的圖片檔案');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = e => {
                previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview" class="preview-image">`;
            };
            reader.readAsDataURL(file);
            onFileSelect(file, null);
        };
    };

    const pollStatus = async (taskId, ui) => {
        const pollInterval = 2000;
        try {
            const response = await fetch(`/status/${taskId}`);
            if (!response.ok) throw new Error('查詢狀態失敗');
            const data = await response.json();

            if (data.state === 10) { // COMPLETED
                ui.hideLoading();
                ui.displayResults(data.images);
                ui.showSuccess('圖片生成成功！');
                ui.enableButton();
            } else if (data.state === 20) { // FAILED
                throw new Error(data.error_message || '圖片生成失敗');
            } else { // PROCESSING
                setTimeout(() => pollStatus(taskId, ui), pollInterval);
            }
        } catch (error) {
            ui.hideLoading();
            ui.showError(error.message);
            ui.enableButton();
        }
    };
    
    const downloadImage = (url, filename) => {
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename || 'generated-image.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            })
            .catch(error => console.error('Download failed:', error));
    };

    // ---模板模式 (Template Mode)---
    (() => {
        const ui = {
            uploadArea: document.getElementById('uploadAreaTemplate'),
            fileInput: document.getElementById('fileInputTemplate'),
            previewContainer: document.getElementById('previewContainerTemplate'),
            templateGrid: document.getElementById('templateGrid'),
            templateLoading: document.getElementById('templateLoading'),
            generateBtn: document.getElementById('generateBtnTemplate'),
            errorMessage: document.getElementById('errorMessageTemplate'),
            successMessage: document.getElementById('successMessageTemplate'),
            resultSection: document.getElementById('resultSectionTemplate'),
            loadingArea: document.querySelector('#resultSectionTemplate .loading'),
            resultImages: document.getElementById('resultImagesTemplate'),
            
            showError: (msg) => { ui.errorMessage.textContent = `❌ ${msg}`; ui.errorMessage.classList.add('show'); },
            hideError: () => ui.errorMessage.classList.remove('show'),
            showSuccess: (msg) => { ui.successMessage.textContent = `✅ ${msg}`; ui.successMessage.classList.add('show'); },
            hideSuccess: () => ui.successMessage.classList.remove('show'),
            showLoading: () => { ui.resultSection.style.display = 'block'; ui.loadingArea.style.display = 'flex'; ui.resultImages.innerHTML = ''; },
            hideLoading: () => ui.loadingArea.style.display = 'none',
            disableButton: (text) => { ui.generateBtn.disabled = true; ui.generateBtn.textContent = text; },
            enableButton: () => { ui.generateBtn.disabled = false; ui.generateBtn.textContent = '重新生成'; },
            updateButtonOnFile: () => { ui.generateBtn.disabled = false; ui.generateBtn.textContent = '點擊開始生成'; },
            displayResults: (images) => {
                ui.resultImages.innerHTML = '';
                if (!images || images.length === 0) {
                    ui.showError('未獲取到生成的圖片');
                    return;
                }
                images.forEach((image, i) => {
                    const imgUrl = image.url || image;
                    const container = document.createElement('div');
                    container.className = 'result-image-container';
                    container.innerHTML = `
                        <img src="${imgUrl}" alt="Generated Image ${i + 1}" class="result-image">
                        <button class="download-btn">下載</button>
                    `;
                    container.querySelector('.download-btn').onclick = () => downloadImage(imgUrl, `template_generated_${i + 1}.jpg`);
                    ui.resultImages.appendChild(container);
                });
            }
        };

        let selectedFile = null;
        let selectedTemplateId = null;

        const onFileSelect = (file, error) => {
            ui.hideError();
            if (error) {
                ui.showError(error);
                selectedFile = null;
                ui.disableButton('請先上傳圖片');
                return;
            }
            selectedFile = file;
            ui.updateButtonOnFile();
        };

        setupUploadArea(ui.uploadArea, ui.fileInput, ui.previewContainer, onFileSelect);
        
        const loadTemplates = async () => {
            try {
                const response = await fetch('/templates');
                const data = await response.json();
                if (data.status !== 'success') throw new Error('載入模板失敗');
                
                ui.templateGrid.innerHTML = '';
                data.templates.forEach((template, index) => {
                    const card = document.createElement('div');
                    card.className = 'template-card';
                    card.dataset.id = template.template_id;
                    card.innerHTML = `
                        <img src="${template.template_image || 'https://via.placeholder.com/150x200.png?text=No+Image'}" class="template-card-image" alt="${template.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150x200.png?text=Error';">
                        <div class="template-card-name">${template.name}</div>
                    `;
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.template-card.selected').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedTemplateId = template.template_id;
                    });
                    if (index === 0) {
                        card.classList.add('selected');
                        selectedTemplateId = template.template_id;
                    }
                    ui.templateGrid.appendChild(card);
                });
                ui.templateLoading.style.display = 'none';

            } catch (error) {
                ui.templateLoading.textContent = `❌ ${error.message}`;
            }
        };

        ui.generateBtn.addEventListener('click', async () => {
            if (!selectedFile) { ui.showError('請先上傳圖片'); return; }
            if (selectedTemplateId === null) { ui.showError('請選擇一個風格模板'); return; }

            ui.hideError();
            ui.hideSuccess();
            ui.showLoading();
            ui.disableButton('生成中...');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('template_id', selectedTemplateId);

            try {
                const response = await fetch('/generate', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || '創建任務失敗');
                }
                const data = await response.json();
                pollStatus(data.task_id, ui);
            } catch (error) {
                ui.hideLoading();
                ui.showError(error.message);
                ui.enableButton();
            }
        });

        loadTemplates();
    })();

    // ---自訂參數模式 (Custom Mode)---
    (() => {
        const ui = {
            uploadArea: document.getElementById('uploadAreaCustom'),
            fileInput: document.getElementById('fileInputCustom'),
            previewContainer: document.getElementById('previewContainerCustom'),
            generateBtn: document.getElementById('generateBtnCustom'),
            errorMessage: document.getElementById('errorMessageCustom'),
            successMessage: document.getElementById('successMessageCustom'),
            resultSection: document.getElementById('resultSectionCustom'),
            loadingArea: document.querySelector('#resultSectionCustom .loading'),
            resultImages: document.getElementById('resultImagesCustom'),

            showError: (msg) => { ui.errorMessage.textContent = `❌ ${msg}`; ui.errorMessage.classList.add('show'); },
            hideError: () => ui.errorMessage.classList.remove('show'),
            showSuccess: (msg) => { ui.successMessage.textContent = `✅ ${msg}`; ui.successMessage.classList.add('show'); },
            hideSuccess: () => ui.successMessage.classList.remove('show'),
            showLoading: () => { ui.resultSection.style.display = 'block'; ui.loadingArea.style.display = 'flex'; ui.resultImages.innerHTML = ''; },
            hideLoading: () => ui.loadingArea.style.display = 'none',
            disableButton: (text) => { ui.generateBtn.disabled = true; ui.generateBtn.textContent = text; },
            enableButton: () => { ui.generateBtn.disabled = false; ui.generateBtn.textContent = '重新生成'; },
            updateButtonOnFile: () => { ui.generateBtn.disabled = false; ui.generateBtn.textContent = '點擊開始生成'; },
            displayResults: (images) => {
                ui.resultImages.innerHTML = '';
                if (!images || images.length === 0) {
                    ui.showError('未獲取到生成的圖片');
                    return;
                }
                images.forEach((image, i) => {
                    const imgUrl = image.url || image;
                    const container = document.createElement('div');
                    container.className = 'result-image-container';
                    container.innerHTML = `
                        <img src="${imgUrl}" alt="Generated Image ${i + 1}" class="result-image">
                        <button class="download-btn">下載</button>
                    `;
                    container.querySelector('.download-btn').onclick = () => downloadImage(imgUrl, `custom_generated_${i + 1}.jpg`);
                    ui.resultImages.appendChild(container);
                });
            }
        };

        const appIdInput = document.getElementById('appId');
        const versionIdInput = document.getElementById('versionId');
        const cnetFormIdInput = document.getElementById('cnetFormId');
        const paramsToggleCustom = document.getElementById('paramsToggleCustom');
        const customParamsInputs = document.getElementById('customParamsInputs');

        let selectedFile = null;
        let customParamsVisible = false; // Track visibility state

        paramsToggleCustom.addEventListener('click', () => {
            customParamsVisible = !customParamsVisible;
            customParamsInputs.style.display = customParamsVisible ? 'block' : 'none';
            paramsToggleCustom.textContent = customParamsVisible ? '隱藏進階設定' : '顯示進階設定';
        });
        
        const onFileSelect = (file, error) => {
            ui.hideError();
            if (error) {
                ui.showError(error);
                selectedFile = null;
                ui.disableButton('請先上傳圖片');
                return;
            }
            selectedFile = file;
            ui.updateButtonOnFile();
        };
        
        setupUploadArea(ui.uploadArea, ui.fileInput, ui.previewContainer, onFileSelect);
        
        ui.generateBtn.addEventListener('click', async () => {
            if (!selectedFile) { ui.showError('請先上傳圖片'); return; }

            ui.hideError();
            ui.hideSuccess();
            ui.showLoading();
            ui.disableButton('生成中...');

            const formData = new FormData();
            formData.append('file', selectedFile);

            const appId = appIdInput.value.trim();
            const versionId = versionIdInput.value.trim();
            const cnetFormId = cnetFormIdInput.value.trim();
            
            if (appId) formData.append('app_id', appId);
            if (versionId) formData.append('version_id', versionId);
            if (cnetFormId) formData.append('cnet_form_id', cnetFormId);

            try {
                const response = await fetch('/create', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || '創建任務失敗');
                }
                const data = await response.json();
                pollStatus(data.task_id, ui);
            } catch (error) {
                ui.hideLoading();
                ui.showError(error.message);
                ui.enableButton();
            }
        });
    })();
});
</script>

</body>
</html>
